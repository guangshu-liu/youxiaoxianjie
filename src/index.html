<script>
(function () {
  // 入口。经典 script，不用 ES Module —— 单文件版要在 file:// 下打开，
  // <script type="module"> 会被 CORS 拦截。
  function start() {
    if (location.hash === '#selftest') {
      G.SelfTest.run();
      return;
    }
    // 三科题库整个交给 Bank.init —— 它按 G.SUBJECTS 自己去取，
    // 这里逐个列出来只会变成「加了科目忘了改这里」。
    G.App.boot(window.G.DATA);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
