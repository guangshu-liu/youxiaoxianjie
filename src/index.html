<script>
(function () {
  // 入口。经典 script，不用 ES Module —— 单文件版要在 file:// 下打开，
  // <script type="module"> 会被 CORS 拦截。
  function start() {
    if (location.hash === '#selftest') {
      G.SelfTest.run();
      return;
    }
    G.App.boot({
      curriculum: window.G.CURRICULUM_DATA,
      chinese: window.G.DATA.chinese,
      math: window.G.DATA.math,
      english: window.G.DATA.english
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
